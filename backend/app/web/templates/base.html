<!doctype html>
<html lang="{{ get_locale() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ _('app.name') }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/avirat.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('web.home') }}">{{ _('app.name') }}</a>
  {% if current_user.is_authenticated %}
  <nav class="top-nav">
    <a href="{{ url_for('web.profile') }}">{{ current_user.name }}</a>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="link" type="submit">{{ _('nav.logout') }}</button>
    </form>
  </nav>
  {% endif %}
</header>
<main class="page">
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <p class="flash flash-{{ category }}" role="alert">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
