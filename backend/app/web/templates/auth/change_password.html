{% extends "base.html" %}
{% block content %}
<h1>{{ _('auth.password.title') }}</h1>
<p>{{ _('auth.password.rule', min=minimum) }}</p>
<form method="post" class="form" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="current_password">{{ _('auth.field.current_password') }}</label>
  <input id="current_password" name="current_password" type="password" required autofocus>
  <label for="new_password">{{ _('auth.field.new_password') }}</label>
  <input id="new_password" name="new_password" type="password" required minlength="{{ minimum }}">
  <label for="confirm_password">{{ _('auth.field.confirm_password') }}</label>
  <input id="confirm_password" name="confirm_password" type="password" required minlength="{{ minimum }}">
  <button type="submit">{{ _('action.save') }}</button>
</form>
{% endblock %}
